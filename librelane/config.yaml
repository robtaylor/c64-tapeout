meta:
  version: 3
  flow: Chip

DESIGN_NAME: chip_top

# Source list — all Verilog/SV. VHDL (c64_system + T65 + VIC + bus logic)
# is pre-synthesized by GHDL into build/c64_system_synth.v via the
# `synth-test` Makefile target (or `make build/c64_system_synth.v`).
# This avoids needing the GHDL-Yosys plugin inside the LibreLane image.
VERILOG_FILES:
# GHDL-pre-synthesized C64 system (T65 + VIC + bus logic + sequencer)
- dir::../build/c64_system_synth.v

# C64 Verilog modules
- dir::../rtl/mos6526.v

# SRAM macro wrapper
- dir::../src/sram_wrapper.sv

# Synthesized ROMs
- dir::../src/rom_kernal.sv
- dir::../src/rom_basic.sv
- dir::../src/rom_chargen.sv

# Tapeout integration
- dir::../src/chip_core.sv
- dir::../src/chip_top.sv

VERILOG_INCLUDE_DIRS:
- dir::../src

# Enable the GF180 OCD SRAM macro instantiation path in sram_wrapper.sv.
# (Without this define, sram_wrapper falls back to a registered array —
# correct for cocotb/Yosys-generic but wrong for PnR.)
VERILOG_DEFINES:
- USE_SRAM_MACROS

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# 9T 5V standard cell library (same as test-tapeout-1)
STD_CELL_LIBRARY: gf180mcu_fd_sc_mcu9t5v0

# Synthesis tuning (adopted from wren6991/riscboy-180 via test-tapeout-1)
SYNTH_ABC_BUFFERING: True
SYNTH_SIZING: True

# SDC
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground
VDD_NETS:
- VDD
GND_NETS:
- VSS

# Ignore disconnected outputs on bidir pads and hard IPs
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__id
- gf180mcu_ws_ip__logo

# Clock: 64 MHz pad (15.625 ns) is the master. ADR 0001 (2026-07-06 amend).
# chip_core divides it by 2 to the 32 MHz C64 system clock (clk32); the
# 32-state sequencer then gives ~1 MHz CPU and ~8 MHz pixel. The QSPI PSRAM
# controller runs on the 64 MHz master. chip_top.sdc declares clk32 as a
# generated (/2) clock so the core is timed — see the SDC and
# docs/plans/memory-integration.md.
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 15.625

# Hold margin
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Placement density — conservative; 8 SRAM macros + moderate logic
PL_TARGET_DENSITY_PCT: 30
GRT_ALLOW_CONGESTION: true

# Antenna repair
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10

# PDN strap layers (default to V=Metal2, H=Metal3 — the PDK exposes
# Metal2 as the LEF METAL2 layer and Metal3 above; without these the
# defaults collide and pdngen errors with PDN-0003).
PDN_VERTICAL_LAYER: Metal2
PDN_HORIZONTAL_LAYER: Metal3

# PDN straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN core ring
PDN_CORE_RING: True
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells / SRAM
MAGIC_GDS_FLATGLOB:
- "*_CDNS_*"
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

MAGIC_EXT_UNIQUE: notopports

MACROS:
  # NOTE: chip_id and wafer_space_logo IP are cosmetic (decoration on the
  # die) and not yet checked into this repo. PnR proceeds without them;
  # re-enable when the IP is pulled into ip/. The padframe slot file may
  # still reference them — they're marked IGNORE_DISCONNECTED_MODULES
  # above, so a missing instance is non-fatal at the floorplan stage.

  # gf180mcu_ws_ip__id:           # TODO: re-enable after pulling IP
  #   gds:
  #     - dir::../ip/gf180mcu_ws_ip__id/gds/gf180mcu_ws_ip__id.gds
  #   lef:
  #     - dir::../ip/gf180mcu_ws_ip__id/lef/gf180mcu_ws_ip__id.lef
  #   vh:
  #     - dir::../ip/gf180mcu_ws_ip__id/vh/gf180mcu_ws_ip__id.v
  #   lib:
  #     "*":
  #       - dir::../ip/gf180mcu_ws_ip__id/lib/gf180mcu_ws_ip__id.lib
  #   instances:
  #     chip_id:
  #       location: [26, 26]
  #       orientation: N

  # gf180mcu_ws_ip__logo:         # TODO: re-enable after pulling IP
  #   gds:
  #     - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
  #   lef:
  #     - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
  #   vh:
  #     - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
  #   lib:
  #     "*":
  #       - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
  #   instances:
  #     _wafer_space_logo_disabled:
  #       location: ["expr::$DIE_AREA[2] + -169.25", "expr::$DIE_AREA[3] + -169.25"]
  #       orientation: N

  # 8 × OCD SRAM macros (8KB): 2 rows × 4 columns
  # Row 0: orientation N (power pins at top)
  # Row 1: orientation S (power pins at bottom, meeting row 0)
  gf180mcu_ocd_ip_sram__sram1024x8m8wm1:
    gds:
      - dir::../deps/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.gds
    lef:
      - dir::../deps/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.lef
    vh:
      - dir::../deps/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__blackbox.v
    lib:
      "*_tt_025C_5v00":
        - dir::../deps/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__tt_025C_3v30.lib
      "*_ff_n40C_5v50":
        - dir::../deps/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__ff_n40C_3v60.lib
      "*_ss_125C_4v50":
        - dir::../deps/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__ss_125C_3v00.lib
    instances:
      # Hierarchical names come from the genvar block in src/sram_wrapper.sv:
      #   for (genvar i = 0; i < 8; i++) begin : macro
      #     gf180mcu_..._sram1024x8m8wm1 macro_inst (...)
      # Yosys preserves these as escaped identifiers (\macro[i].macro_inst).
      #
      # Row 0 (orientation N)
      "i_chip_core.sram_u.macro[0].macro_inst": { location: [2000,  600], orientation: N }
      "i_chip_core.sram_u.macro[1].macro_inst": { location: [2350,  600], orientation: N }
      "i_chip_core.sram_u.macro[2].macro_inst": { location: [2700,  600], orientation: N }
      "i_chip_core.sram_u.macro[3].macro_inst": { location: [3050,  600], orientation: N }
      # Row 1 (orientation S)
      "i_chip_core.sram_u.macro[4].macro_inst": { location: [2000, 1166], orientation: S }
      "i_chip_core.sram_u.macro[5].macro_inst": { location: [2350, 1166], orientation: S }
      "i_chip_core.sram_u.macro[6].macro_inst": { location: [2700, 1166], orientation: S }
      "i_chip_core.sram_u.macro[7].macro_inst": { location: [3050, 1166], orientation: S }

PDN_MACRO_CONNECTIONS:
# Regex matches all 8 macro instances. PDN_MACRO_CONNECTIONS is treated
# as regex by OpenROAD's pdngen — bracket-escaping in YAML strings is
# fiddly, so we sidestep it with `.` (any char) and `\d` (digit).
- '.*macro_inst VDD VSS VDD VSS'

FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5

PDN_CFG: dir::pdn_cfg.tcl
