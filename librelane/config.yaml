meta:
  version: 3
  flow: Chip

DESIGN_NAME: chip_top

# Source list — all Verilog/SV. VHDL (c64_system + T65 + VIC + bus logic)
# is pre-synthesized by GHDL into build/c64_system_synth.v via the
# `synth-test` Makefile target (or `make build/c64_system_synth.v`).
# This avoids needing the GHDL-Yosys plugin inside the LibreLane image.
VERILOG_FILES:
# GHDL-pre-synthesized C64 system (T65 + VIC + bus logic + sequencer)
- dir::../build/c64_system_synth.v

# C64 Verilog modules
- dir::../rtl/mos6526.v

# QSPI PSRAM controller + vendored PULP serial engine (bulk 64 KB RAM path)
- dir::../ip/pulp/spi_master_clkgen.sv
- dir::../ip/pulp/spi_master_tx.sv
- dir::../ip/pulp/spi_master_rx.sv
- dir::../ip/pulp/spi_master_controller.sv
- dir::../rtl/qspi_psram_ctrl.sv

# On-die 5V ZP/stack SRAM (2× sram256x8; instantiates the macro under USE_SRAM_MACROS)
- dir::../src/zpstack_sram.sv

# Synthesized ROMs
- dir::../src/rom_kernal.sv
- dir::../src/rom_basic.sv
- dir::../src/rom_chargen.sv

# Tapeout integration
- dir::../src/chip_core.sv
- dir::../src/chip_top.sv

VERILOG_INCLUDE_DIRS:
- dir::../src

# Enable the GF180 5V SRAM macro instantiation path in zpstack_sram.sv.
# (Without this define, zpstack_sram falls back to a registered array —
# correct for cocotb/Yosys-generic but wrong for PnR.)
VERILOG_DEFINES:
- USE_SRAM_MACROS

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# 9T 5V standard cell library (same as test-tapeout-1)
STD_CELL_LIBRARY: gf180mcu_fd_sc_mcu9t5v0

# Synthesis tuning (adopted from wren6991/riscboy-180 via test-tapeout-1)
SYNTH_ABC_BUFFERING: True
SYNTH_SIZING: True

# SDC
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground
VDD_NETS:
- VDD
GND_NETS:
- VSS

# Ignore disconnected outputs on bidir pads and hard IPs
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__id
- gf180mcu_ws_ip__logo

# Clock: 64 MHz pad (15.625 ns) is the master. ADR 0001 (2026-07-06 amend).
# chip_core divides it by 2 to the 32 MHz C64 system clock (clk32); the
# 32-state sequencer then gives ~1 MHz CPU and ~8 MHz pixel. The QSPI PSRAM
# controller runs on the 64 MHz master. chip_top.sdc declares clk32 as a
# generated (/2) clock so the core is timed — see the SDC and
# docs/plans/memory-integration.md.
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 15.625

# Hold margin
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Placement density + cell padding (crib-proven values from test-tapeout-1).
# The 20 KB of ROMs synthesized as LUTs make the core logic-dense despite the
# large die, so keep density modest and spread cells out — this gives the
# router headroom and legalisation room for antenna-diode insertion.
PL_TARGET_DENSITY_PCT: 30
GRT_ALLOW_CONGESTION: true
GPL_CELL_PADDING: 2
DPL_CELL_PADDING: 1
# The LUT-ROM logic density drives routing congestion ~1.25; RePlAce's
# routability-driven cell-inflation loop then can't converge and diverges
# numerically (GPL-0305, +170% inflation → NaN). Disable that loop so global
# placement settles at target density, and let GlobalRouting absorb the
# congestion (GRT_ALLOW_CONGESTION above). Reset/enable nets (~2050 fanout)
# remain high-fanout but route out with the congestion allowance.
PL_ROUTABILITY_DRIVEN: false

# Antenna repair
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10

# PDN strap layers: use the gf180 PDK defaults (V=Metal4, H=Metal5). This is
# the silicon-proven 5V-SRAM stack from test-tapeout-1 / riscboy-180 — the
# stdcell power grid rides high metals, leaving Metal2/Metal3 for the SRAM
# macro's own power pins, which the SRAM Metal4 straps reach via the
# Metal4↔Metal3 core-ring connect. The earlier Metal2/Metal3 override put the
# grid on the same layers as the macro pins, so the SRAM straps could never
# via down to them (PSM-0039 → RePlAce divergence, exactly as in phase-1).

# PDN straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN core ring
PDN_CORE_RING: True
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
# Core ring on Metal4(V)/Metal3(H). The guarded core-ring connects in
# pdn_cfg.tcl then add Metal4↔Metal3, Metal4↔Metal2 and Metal3↔Metal2, giving
# the full Metal2↔Metal3↔Metal4↔Metal5 via stack that ties the SRAM Metal4
# straps and the macro's Metal2/Metal3 power pins into the high-metal grid.
# Matches the test-tapeout-1 / riscboy-180 5V-SRAM PDN topology.
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3

ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells / SRAM
MAGIC_GDS_FLATGLOB:
- "*_CDNS_*"
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

MAGIC_EXT_UNIQUE: notopports

MACROS:
  # NOTE: chip_id and wafer_space_logo IP are cosmetic (decoration on the
  # die) and not yet checked into this repo. PnR proceeds without them;
  # re-enable when the IP is pulled into ip/. The padframe slot file may
  # still reference them — they're marked IGNORE_DISCONNECTED_MODULES
  # above, so a missing instance is non-fatal at the floorplan stage.

  # gf180mcu_ws_ip__id:           # TODO: re-enable after pulling IP
  #   gds:
  #     - dir::../ip/gf180mcu_ws_ip__id/gds/gf180mcu_ws_ip__id.gds
  #   lef:
  #     - dir::../ip/gf180mcu_ws_ip__id/lef/gf180mcu_ws_ip__id.lef
  #   vh:
  #     - dir::../ip/gf180mcu_ws_ip__id/vh/gf180mcu_ws_ip__id.v
  #   lib:
  #     "*":
  #       - dir::../ip/gf180mcu_ws_ip__id/lib/gf180mcu_ws_ip__id.lib
  #   instances:
  #     chip_id:
  #       location: [26, 26]
  #       orientation: N

  # gf180mcu_ws_ip__logo:         # TODO: re-enable after pulling IP
  #   gds:
  #     - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
  #   lef:
  #     - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
  #   vh:
  #     - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
  #   lib:
  #     "*":
  #       - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
  #   instances:
  #     _wafer_space_logo_disabled:
  #       location: ["expr::$DIE_AREA[2] + -169.25", "expr::$DIE_AREA[3] + -169.25"]
  #       orientation: N

  # 2 × 5V SRAM macros (512 B ZP/stack): gf180mcu_fd_ip_sram__sram256x8m8wm1.
  # 5V-native — genuine tt_025C_5v00 / ff_n40C_5v50 / ss_125C_4v50 corners
  # (no 3.3V→5V aliasing; that mismatch was the phase-1 PnR divergence, see
  # docs/plans/archive/initial-core-bringup.md + ADR 0004 §9). Views come from
  # the PDK (libs.ref), not deps/. Macro is 431.86 × 340.88 µm.
  gf180mcu_fd_ip_sram__sram256x8m8wm1:
    gds:
      - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_ip_sram/gds/gf180mcu_fd_ip_sram__sram256x8m8wm1.gds
    lef:
      - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_ip_sram/lef/gf180mcu_fd_ip_sram__sram256x8m8wm1.lef
    vh:
      - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_ip_sram/verilog/gf180mcu_fd_ip_sram__sram256x8m8wm1__blackbox.v
    lib:
      "*_tt_025C_5v00":
        - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram256x8m8wm1__tt_025C_5v00.lib
      "*_ff_n40C_5v50":
        - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram256x8m8wm1__ff_n40C_5v50.lib
      "*_ss_125C_4v50":
        - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram256x8m8wm1__ss_125C_4v50.lib
    instances:
      # Hierarchical names come from the genvar block in src/zpstack_sram.sv:
      #   for (genvar i = 0; i < 2; i++) begin : macro
      #     gf180mcu_fd_ip_sram__sram256x8m8wm1 macro_inst (...)
      # Yosys preserves these as escaped identifiers (\macro[i].macro_inst).
      # Placed side-by-side in the lower core, well clear of the 442 µm core
      # edge and each other (431.86 µm wide + 10 µm halo → 600 µm pitch).
      "i_chip_core.zpstack_u.macro[0].macro_inst": { location: [1600, 900], orientation: N }
      "i_chip_core.zpstack_u.macro[1].macro_inst": { location: [2200, 900], orientation: N }

PDN_MACRO_CONNECTIONS:
# Regex matches both macro instances. PDN_MACRO_CONNECTIONS is treated as
# regex by OpenROAD's pdngen — bracket-escaping in YAML strings is fiddly,
# so we sidestep it with `.` (any char). Macro power pins are VDD/VSS.
- '.*macro_inst VDD VSS VDD VSS'

FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5

PDN_CFG: dir::pdn_cfg.tcl
