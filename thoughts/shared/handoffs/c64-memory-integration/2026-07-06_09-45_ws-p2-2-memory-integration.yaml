questions:
  - "Sequencer early-trigger mechanism (task 4): rework ramCE timing in-place, or add a separate psram_start strobe feeding the qspi trigger? qspi triggers on ce_rise of its ramCE input."
  - "Decision (ii): memory-ready/stall safety-net for worst-case sprite-heavy badlines — deferred until the integrated sim can measure real slack. Revisit after boot works."

decisions:
  - hybrid_memory: "On-die 5V SRAM for ZP ($0000-$00FF) + stack ($0100-$01FF) via 2x sram256x8; bulk 64 KB stays external QSPI PSRAM. Screen matrix NOT carved out (relocates via $D018, bitmap bypass) -> served by the ~40 B VIC line-buffer instead. Color RAM stays flops. ADR 0004 §9."
  - clock_64mhz: "Pad clock is 64 MHz; one flop /2 -> 32 MHz core (cycle-accuracy unchanged); qspi runs at 64 MHz for 32 MHz SCK (min divide /2). Two synchronous 2x domains, no async CDC. ADR 0001 (2026-07-06)."
  - split_in_chip_core: "The ZP/stack-vs-PSRAM physical decode lives in chip_core.sv, NOT c64_buslogic.vhd. c64_system's cs_ram is location-agnostic; c64_buslogic:162-165 (when X\"0\") is the memory-MAP decode and does not change."

findings:
  - early_trigger_required: "qspi quad read ~500 ns. Current ramCE fires late (c64_system.vhd:433, CYCLE_VIC0 state 12 / cpu_cyc CYCLE_CPUC state 28), ~94 ns before the CPU sample (~state 30/31 via enableCpu=cpu_cyc_s(1)). Read can't finish -> CPU latches garbage -> boot fails. Must fire at window start; cpuAddr is stable from the start of the period, vicAddr during the VIC phase."
  - port_00_01_safe: "cpu_6510.vhd:76-77 muxes reads of $0000/$0001 to the internal processor-port register (ioDir/currentIO), never the bus di. So the ZP-SRAM shadow write underneath is harmless; no address exclusion needed. VERIFIED by reading the source."
  - macro_sync_read: "gf180mcu_fd_ip_sram macro Q is registered (synchronous read, 1-cycle latency). zpstack_sram registers its behavioural read to match, so sim == silicon."
  - no_waitstate_path: "c64_system samples ramDin combinationally (c64_buslogic dataToCpu <= ramData) at the CPU edge and never consumes qspi `ready`/latency. The early-trigger must close by construction; ZP/stack SRAM is 1-cycle so always ready in-window."
  - sdc_generated_clock: "Core now runs on the divided clk32, so chip_top.sdc needs a create_generated_clock (added, guarded on *clk32_div*/Q). Only PnR-verifiable — WS-P2-3 must confirm the pin path on the first librelane run or the core is unconstrained."

