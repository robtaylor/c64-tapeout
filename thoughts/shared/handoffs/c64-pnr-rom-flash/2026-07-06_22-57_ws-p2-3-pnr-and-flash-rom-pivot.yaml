questions:
  - "Flash read command: 0x0B single-lane fast-read vs 0xEB quad (match the PSRAM QPI path)? Decide in WS-P2-10 task 1."
  - "ROM prefetch buffer size / line width — co-design with the deferred VIC c-access line-buffer (WS-P2-2 task 5)."
  - "Worst-case concurrency (VIC CHARGEN + CPU instr fetch + CPU RAM in one cycle on the shared bus) — re-measure slack in integrated sim; may need a stall safety-net (deferred decision ii)."

decisions:
  - roms_to_external_flash: "20 KB KERNAL/BASIC/CHARGEN as LUT case(addr) mux trees = the routing congestion source. GF180 has no ROM IP; SRAM-as-ROM = ~40 macros + boot load. Move to external QSPI NOR flash on the SHARED bus, +1 CS on bidir[39] (last spare pad; budget now fully spent). Read-only, prefetch buffer. ADR 0005."
  - pdn_5v_sram_stack: "Use the crib (test-tapeout-1 / riscboy-180) silicon-proven 5V-SRAM PDN: gf180 default PDN layers Metal4(V)/Metal5(H) + core ring Metal4/Metal3. The prior Metal2/Metal3 override collided with the macro's own Metal2/Metal3 power pins -> straps unreachable -> PSM-0039 -> RePlAce NaN (the phase-1 symptom)."
  - routability_off: "PL_ROUTABILITY_DRIVEN false so GlobalPlacement's cell-inflation loop (diverged on the LUT-ROM density) is skipped; GlobalRouting absorbs congestion (GRT_ALLOW_CONGESTION)."

findings:
  - phase1_wall_was_pdn_not_voltage: "Phase-1 diverged because the 3.3V OCD macro floated its rails. With the 5V fd_ip_sram macro AND the correct Metal4/Metal5 PDN layer stack, macro power connects (PSM-0039 gone) and placement converges. The macro power pins are Metal2(ring)+Metal3(fingers); the Metal4 SRAM straps reach them via the Metal4<->Metal3 core-ring connect."
  - clk32_net_name: "Synthesis renames the clk32 divider flop generically (e.g. _70125_), but the NET it drives keeps the stable RTL name i_chip_core.c64_u.buslogic.clk (6k-fanout core clock). SDC now finds the driver pin via that net (get_pins -of_objects), and sources the generated clock from the master's own object ($port_args) so STA traces it (fixes STA-1060). chip_top.sdc:28-44."
  - lut_rom_congestion: "GlobalRouting ran 3+ hrs CPU (98%) without converging, congestion ~1.25, driven by the ROM mux fabric. rom_kernal/basic/chargen.sv are auto-gen case(addr). Only on-die memory should be color RAM (1024x4 flops) + ZP/stack (2x sram256x8); everything else external QSPI."
  - pdk_lib_subdir: "The project-local PDK (gf180mcu/, cloned via make clone-pdk, PDK_TAG 1.8.0) uses lib/ for liberty files, NOT liberty/ (the ~/.volare copy uses liberty/). MACROS lib paths must use lib/."
  - jacquard_flash_cosim: "Jacquard already models a QSPI flash peripheral (the qspi_ram was built by extending flash). External-flash ROMs are directly cosim-able in WS-P2-6. See [[jacquard-cosim-psram-qspi]] memory + thoughts/shared/handoffs/jacquard-qspi-cosim/."

