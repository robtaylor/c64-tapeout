  - "Incremental PnR: each fix moved the failure to a later stage (config-load -> PDN-0186 -> PSM-0039 -> GPL-0305 routability -> STA-1060 -> routing), which localized each root cause."
  - "nohup + disown for the >10min PnR run (the harness kills background Bash at the 600000ms timeout); Monitor tool (timeout up to 3600000ms) to watch for completion."

