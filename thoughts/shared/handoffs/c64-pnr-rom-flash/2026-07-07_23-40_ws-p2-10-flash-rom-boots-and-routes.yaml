decisions:
  - flash_qpi_0xEB: "Assume a QPI-capable NOR flash (QE set at provisioning) so the flash reuses the PSRAM quad path at 0.5us/read. User confirmed QPI parts are well-stocked. Engine can't do dual (verified) or mixed-lane NOR reads, so full-QPI is the only fast option that fits."
  - early_rom_trigger_mirrors_psram: "romCE fires at CYCLE_EXT0 like psramCE; cpu_cs_rom/cpu_cs_ram mutually exclusive so only ONE QSPI transaction per period. Same discipline as WS-P2-2 PSRAM early-trigger."
  - fixture_first_task6: "Emit cocotb/fixtures/c64_flash_rom.bin BEFORE deleting rom_*.sv (the test's only ROM-byte source), so sim-smoke never breaks. build_flash_image.py is dual-use (test + physical flash provisioning)."
  - prefetch_deferred: "ADR 0005 amendment: with 0.5us QPI reads the prefetch buffer is an OPTIMIZATION, not load-bearing. Deferred as task 2."

findings:
  - pnr_pivot_worked: "Removing the 20KB LUT-ROM mux fabric from the hierarchy is THE fix. GRT: 6s vs 3+hrs. route-DRC=0. synth peak mem 325->220MB, synth warnings 26->3. This validates ADR 0005 end-to-end."
  - jacquard_source_line_passthrough: "The Jacquard pre-release installed on this Mac now has SOURCE LINE PASS THROUGH - makes it much easier to figure out where wires come from. Useful for BOTH timing-closure debug (tracing the 10 setup paths back to RTL) AND task 8 (Jacquard PSRAM+flash cosim on the post-PnR netlist). See [[jacquard-cosim-psram-qspi]]."
  - engine_en_quad_per_transaction: "PULP engine en_quad_int (spi_master_controller.sv:531-535) is a PER-TRANSACTION latch (set on qrd/qwr, clears at IDLE), NOT a sticky QPI-mode bit. So the flash enter-QPI (0x38, eng_wr) goes out single-lane even after the PSRAM's 0x35 - correct on real silicon, not just sim."
  - background_agents_stalled: "TWO background review/impl agents stalled on the 600s stream watchdog this session (altitude review + first tasks-3-5 kraken). FOREGROUND kraken runs completed fine. Prefer foreground for substantial agent work; a stalled agent may still have applied partial edits - check the tree before relaunching."

